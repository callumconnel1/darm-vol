name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests examples
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel smoke test in clean environment
        run: |
          python -m venv /tmp/darm-wheel-smoke
          /tmp/darm-wheel-smoke/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/darm-wheel-smoke/bin/python -c 'from darm_vol import DARM; print(DARM(lags=5))')
