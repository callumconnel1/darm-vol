[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darm-vol"
version = "0.1.1"
description = "Decaying AutoRegressive Memory models for finite-memory conditional volatility"
readme = "README-pypi.md"
authors = [{name = "Callum Connell"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["volatility", "ARCH", "conditional variance", "financial econometrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
plot = ["matplotlib>=3.6"]
performance = ["numba>=0.58"]
dev = ["pytest>=7", "ruff>=0.6", "build>=1", "twine>=5", "pandas>=1.5", "matplotlib>=3.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
